<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EventHub 트렌드 분석 — 대시보드 허브</title>
<style>
  :root{
    --orange:#FF6F00; --blue:#2D6CDF; --ink:#1C2530; --bg:#FBF7F1; --card:#FFFFFF;
    --line:#E9E2D6; --muted:#8A8578;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    letter-spacing:-0.01em; display:flex; flex-direction:column; height:100vh;}

  header{padding:16px 24px; border-bottom:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:white;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .brand-name{font-size:15px;font-weight:800;}
  .brand-sub{font-size:11px;color:var(--muted);}

  .tabs{display:flex; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:4px;}
  .tab-btn{border:none;background:transparent;padding:9px 16px;border-radius:8px;font-size:13px;
    font-weight:700;cursor:pointer;color:var(--ink);opacity:.55;display:flex;align-items:center;gap:6px;}
  .tab-btn.active{opacity:1;color:white;}
  .tab-btn[data-tab="simulation"].active{background:var(--orange);}
  .tab-btn[data-tab="real"].active{background:var(--blue);}

  .frame-wrap{flex:1; position:relative;}
  iframe{width:100%; height:100%; border:none; display:none;}
  iframe.active{display:block;}

  .intro-banner{padding:10px 24px; font-size:12px; color:var(--muted); background:var(--card);
    border-bottom:1px solid var(--line);}
  .intro-banner b{color:var(--ink);}
  .intro-banner.sim{border-left:4px solid var(--orange);}
  .intro-banner.real{border-left:4px solid var(--blue);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">E</div>
    <div>
      <div class="brand-name">EventHub 트렌드 분석 대시보드</div>
      <div class="brand-sub">AI 데이터 분석 미션 — 두 가지 버전</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="simulation">📊 시뮬레이션 분석</button>
    <button class="tab-btn" data-tab="real">🔍 실제 데이터 분석</button>
  </div>
</header>

<div class="intro-banner sim" id="introBanner">
  <b>시뮬레이션 분석</b>: EventHub가 실제로 운영되고 있다면 어떨지 가정한 데이터입니다
  (실제 카탈로그 160건 + 통계적 시뮬레이션). 자세히는
  <a href="https://github.com/krasia45/trend-analysis-l/tree/main/simulation-analysis" target="_blank">simulation-analysis 폴더</a> 참고.
</div>

<div class="frame-wrap">
  <iframe id="frame-simulation" class="active" src="simulation/index.html"></iframe>
  <iframe id="frame-real" src="real-data/index.html"></iframe>
</div>

<script>
const banners = {
  simulation: `<b>시뮬레이션 분석</b>: EventHub가 실제로 운영되고 있다면 어떨지 가정한 데이터입니다
    (실제 카탈로그 160건 + 통계적 시뮬레이션). 자세히는
    <a href="https://github.com/krasia45/trend-analysis-l/tree/main/simulation-analysis" target="_blank">simulation-analysis 폴더</a> 참고.`,
  real: `<b>실제 데이터 분석</b>: NAVER 실제 검색어 트렌드(365일)를 그대로 사용한 데이터입니다.
    자세히는 <a href="https://github.com/krasia45/trend-analysis-l/tree/main/real-data-analysis" target="_blank">real-data-analysis 폴더</a> 참고.`
};

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll("iframe").forEach(f => f.classList.remove("active"));

    const tab = btn.dataset.tab;
    const banner = document.getElementById("introBanner");
    banner.className = "intro-banner " + (tab === "simulation" ? "sim" : "real");
    banner.innerHTML = banners[tab];

    if (tab === "simulation") document.getElementById("frame-simulation").classList.add("active");
    else document.getElementById("frame-real").classList.add("active");
  });
});
</script>

</body>
</html>
